name: Release

on:
  push:
    tags: ["v*.*.*"]

# Every job asks for what it needs; nothing gets write access by default.
permissions:
  contents: read

jobs:
  check-version:
    # Runs before anything publishes: the tag, package.json and server.json must
    # name the same version, or postinstall.js and the MCP registry would point
    # at a release that does not match.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          # server.json carries the version twice: its own, and packages[0].version,
          # the npm version the MCP registry installs.
          for field in "package.json:.version" "server.json:.version" "server.json:.packages[0].version"; do
            f="${field%%:*}"
            got=$(node -p "require('./$f')${field#*:}")
            if [ "$got" != "$v" ]; then
              echo "::error file=$f::${field#*:} is $got, the tag says $v"
              exit 1
            fi
          done

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser publishes with the GITHUB_TOKEN env below; no token
          # stays in .git/config while it and the signing secrets are loaded.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .goreleaser.yaml skips signing when the secrets are absent, which is
      # right for snapshots and wrong for a release: stop here instead.
      - name: Require the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=0
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # An exact version: this job holds the signing identity, so it never
          # runs a GoReleaser release that came out after this line was written.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # The npm job ships these hashes inside the package, so postinstall.js
      # never trusts a checksums file fetched from the (mutable) release page.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so there is no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: .
      - name: The package carries the hashes of both archives
        run: |
          v="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            grep -Eq "^[0-9a-f]{64}  vpn-bypass-mcp_${v}_darwin_${arch}\.tar\.gz$" checksums.txt \
              || { echo "::error::checksums.txt has no line for vpn-bypass-mcp_${v}_darwin_${arch}.tar.gz"; exit 1; }
          done
          npm pack --dry-run --json | jq -e '[.[0].files[].path] | index("checksums.txt")'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+; Node 24 ships both.
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      # npm refuses a pre-release version (v0.2.0-rc1) without a dist-tag;
      # publish those under "next" so "latest" keeps the last stable release.
      #
      # A version already on npm is skipped, so a failed release can be re-run
      # after the missing piece is fixed (the first release of a new package is
      # published by hand, because a trusted publisher can only be added to a
      # package that exists).
      - run: |
          v="${GITHUB_REF_NAME#v}"
          # npm view exits 0 with no output for a missing version of an existing package.
          if [ -n "$(npm view "vpn-bypass-mcp@$v" version 2>/dev/null)" ]; then
            echo "vpn-bypass-mcp@$v is already on npm; nothing to publish"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            *-*) npm publish --tag next --loglevel verbose ;;
            *) npm publish --loglevel verbose ;;
          esac

  mcp-registry:
    needs: npm-publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
