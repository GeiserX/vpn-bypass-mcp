name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  check-version:
    # Runs before anything publishes: the tag, package.json and server.json must
    # name the same version, or postinstall.js and the MCP registry would point
    # at a release that does not match.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in package.json server.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$v" ]; then
              echo "::error file=$f::version is $got, the tag says $v"
              exit 1
            fi
          done

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so there is no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+; Node 24 ships both.
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --loglevel verbose
