name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      # The npm wrapper's download and checksum code (postinstall.js, run.js).
      - name: node tests
        run: node --test postinstall.test.js

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Build govulncheck for this Linux runner, then point it at the darwin
      # build of each release architecture, because the release binaries are
      # darwin amd64 and arm64 only.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch "$(go env GOPATH)/bin/govulncheck" ./...
          done

  build:
    # Builds the release archives from .goreleaser.yaml without publishing, so
    # a broken release config goes red here instead of on the tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
      - name: Archives postinstall.js downloads
        run: |
          ls dist
          for arch in amd64 arm64; do
            f=$(ls dist/vpn-bypass-mcp_*_darwin_${arch}.tar.gz)
            tar -tzf "$f" | grep -qx vpn-bypass-mcp
            grep -q "$(basename "$f")" dist/checksums.txt
          done
      # release.yml puts GoReleaser's checksums.txt into the npm package; the
      # package must carry it, or postinstall.js refuses to download.
      - name: npm package contents
        run: |
          cp dist/checksums.txt checksums.txt
          npm pack --dry-run --json | jq -e '[.[0].files[].path] | index("checksums.txt") and index("run.js") and index("postinstall.js")'
      - name: Wait-for-npm script
        run: .github/scripts/wait-for-npm_test.sh
